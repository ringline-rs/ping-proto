name: Kani

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify bounded parser properties
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.67.0"
          args: "--output-format terse"
